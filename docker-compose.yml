version: "3.9"

networks:
  internal:
    driver: bridge

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    expose:
      - "8123"
    volumes:
      - ./home-assistant/config:/config
    networks:
      - internal

  vllm:
    image: vllm/vllm-openai:v0.4.2
    container_name: vllm
    expose:
      - "8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
    command: >
      mistralai/Mistral-7B-Instruct
      --host 0.0.0.0
      --port 8000
      --max-model-len 2048
    deploy:
      resources:
        limits:
          memory: 16G
    networks:
      - internal

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: mcp
    working_dir: /app
    environment:
      - HA_URL=http://homeassistant:8123
      - HA_TOKEN=${HA_TOKEN}
      - MCP_API_KEY=${MCP_API_KEY}
    expose:
      - "8090"
    networks:
      - internal
    depends_on:
      - homeassistant

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    environment:
      - MCP_API_KEY=${MCP_API_KEY}
    networks:
      - internal
    depends_on:
      - mcp
      - vllm
